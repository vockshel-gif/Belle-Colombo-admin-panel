      stroke-dasharray: 536 1072;
      stroke-dashoffset: 548;
      animation: bc-draw 1.7s cubic-bezier(.55, .05, .15, 1) 0.1s forwards;
    }
    .mark {
      transform-box: fill-box;
      transform-origin: 50% 60%;
      animation:
        bc-settle 2s cubic-bezier(.2, .7, .2, 1) 0.1s both,
        bc-glow .9s ease-out 1.65s both;
    }
    .logo { fill: #bca685; }
    @keyframes bc-draw { to { stroke-dashoffset: 0; } }
    @keyframes bc-settle {
      from { transform: scale(.96); }
      to   { transform: scale(1); }
    }
    @keyframes bc-glow {
      0%   { filter: drop-shadow(0 0 0 rgba(188, 166, 133, 0)); }
      40%  { filter: drop-shadow(0 0 5px rgba(188, 166, 133, .5)); }
      100% { filter: drop-shadow(0 0 0 rgba(188, 166, 133, 0)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trim { animation: none; stroke-dashoffset: 0; }
      .mark { animation: none; }
    }
  </style>
